<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Open House Poster</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="poster">
    <p id="event" class="step-label"></p>
    <h1>สร้างนามบัตรของคุณ</h1>
    <p>Scan to make your own card</p>
    <canvas id="qr" role="img" aria-label="QR code that opens the card maker"></canvas>
    <p id="url" class="url"></p>
    <button id="print" type="button" class="btn no-print">Print poster</button>
    <p id="localWarning" class="notice no-print" hidden>This address only works on this computer. Print the poster from the final website address.</p>
  </main>
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="poster.js"></script>
</body>
</html>
